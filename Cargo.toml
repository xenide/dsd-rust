[package]
name = "dsd-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bit-perfect DSD command line player (DSD over PCM 1.1)"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
ratatui = "0.29.0"
rtrb = "0.4.0"
thiserror = "2.0.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.72.1"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2.18"
libc = "0.2.180"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
